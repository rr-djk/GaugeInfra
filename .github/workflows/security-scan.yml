name: Security Scan

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  sca:
    name: Trivy scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # audit-only: logs egress but does not block it (same for every
      # harden-runner step in this file).
      # TODO: switch to egress-policy: block with allowed-endpoints list later.
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect dependency changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            deps:
              - 'pyproject.toml'
              - 'uv.lock'

      - name: Run Trivy
        if: steps.changes.outputs.deps == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: uv.lock
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  sast:
    name: Semgrep scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Semgrep venv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/semgrep-venv
          key: semgrep-venv-${{ runner.os }}

      - name: Install Semgrep
        run: |
          if [ ! -x /tmp/semgrep-venv/bin/semgrep ]; then
            python3 -m venv /tmp/semgrep-venv
            /tmp/semgrep-venv/bin/pip install --upgrade pip
            /tmp/semgrep-venv/bin/pip install semgrep==1.172.0
          fi

      - name: Run Semgrep
        run: /tmp/semgrep-venv/bin/semgrep --config=auto --sarif --output=semgrep.sarif . || true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
