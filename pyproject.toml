[project]
name = "gaugeinfra-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["python-hcl2>=8.1.2"]

[dependency-groups]
dev = ["pytest>=9", "pytest-cov>=7", "mutmut>=3.7"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "C90", "I", "UP", "B", "SIM"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
pythonpath = ["backend/src"]
testpaths = ["backend/tests"]
markers = ["dogfood: tests sur le vrai infra/"]
addopts = "-ra"

[tool.mutmut]
paths_to_mutate = ["backend/src/parser"]
tests_dir = "backend/tests"
